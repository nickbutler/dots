// --- presenter window (N): thumbnails, notes, controls, elapsed timer ------
// about:blank inherits our origin, so we drive its DOM directly — no
// BroadcastChannel needed (which is unreliable on file://). The sidebar is
// made of real slides: each live section is cloned and scaled down, so the
// presenter sees the deck itself rather than a list of titles, and every
// renderer gets thumbnails for free the day it is written.
let pres = null;
function openPresenter() {
  if (pres && !pres.closed) { pres.focus(); return; }
  pres = open("", "deck-presenter", "width=1280,height=800");
  if (!pres) return; // popup blocked
  const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // copy the deck's own stylesheet so the clones render as real slides; the
  // presenter chrome is written after it, so it wins on body and layout
  const deckCSS = [...document.querySelectorAll("style")].map((n) => n.textContent).join("\n");
  // html.static: reveals shown, scrubs collapsed, snapping off — the clones
  // are stills, so they must not sit in their pre-entrance state
  pres.document.write(`<!doctype html><html class="static"><head><title>Presenter — ${deckTitle}</title>
    <style>${deckCSS}</style>
    <style>
    :root { --ts: 0.145; }   /* thumbnail scale: the 1920px page × --ts */
    html.static, body { height: 100vh; }
    body { margin: 0; background: ${v("--surface")}; color: ${v("--text")}; overflow: hidden;
      font: 14px/1.6 ${v("--font-mono")}, ui-monospace, monospace;
      display: grid; grid-template-columns: calc(1920px * var(--ts) + 2.4rem) 1fr; }
    .p-side { border-right: 1px solid ${v("--line")}; overflow-y: auto; padding: 0.7rem; display: grid; gap: 0.5rem; align-content: start; }
    .p-nav-row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.35rem; border-radius: 9px; cursor: pointer; }
    .p-nav-row:hover { background: ${v("--surface-2")}; }
    .p-nav-row.on { background: ${v("--accent")}; }
    .p-thumb { width: calc(1920px * var(--ts)); height: calc(1080px * var(--ts));
      overflow: hidden; border-radius: 5px; border: 1px solid ${v("--line")}; position: relative; background: ${v("--bg")}; }
    /* the clone lays out at full page size with the print viewport-unit
       values pinned, then scales down as one box — the same trick print
       uses, for the same reason: raw vw/vh would resolve against this window */
    .p-thumb-inner { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
      --vw: 19.2px; --vh: 10.8px; --vmax: 19.2px;
      transform-origin: top left; transform: scale(var(--ts)); }
    .p-row-meta { display: flex; gap: 0.5rem; margin-top: 0.35rem; font-size: 0.8rem; color: ${v("--muted")}; }
    .p-nav-row.on .p-row-meta, .p-nav-row.on .p-n { color: ${v("--bg")}; }
    .p-n { color: ${v("--faint")}; }
    .p-t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-main { padding: 2rem 2.4rem; display: grid; gap: 1.3rem; align-content: start; overflow-y: auto; }
    .p-top { display: flex; align-items: center; gap: 1.4rem; }
    .p-clock { font-size: 2.4rem; color: ${v("--accent")}; font-weight: 600; }
    .p-ctrl { margin-left: auto; display: flex; gap: 0.6rem; }
    .p-ctrl button { background: ${v("--surface-2")}; border: 1px solid ${v("--line")}; color: ${v("--text")};
      font: inherit; padding: 0.5rem 1.1rem; border-radius: 8px; cursor: pointer; }
    .p-ctrl button:hover { background: ${v("--accent")}; border-color: ${v("--accent")}; color: ${v("--bg")}; }
    .p-eyebrow { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: ${v("--accent")}; }
    .p-cur { font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
    .p-notes ul { margin: 0.5rem 0; padding-left: 1.2rem; }
    .p-notes li { color: ${v("--muted")}; margin: 0.45rem 0; max-width: 62ch; font-size: 1.02rem; }
    .p-notes li::marker { color: ${v("--accent")}; }
    .p-next { color: ${v("--faint")}; border-top: 1px solid ${v("--line")}; padding-top: 1rem; }
  </style></head><body>
    <div class="p-side"></div>
    <div class="p-main">
      <div class="p-top">
        <div class="p-clock">00:00</div>
        <div class="p-ctrl"><button class="p-prev">&lsaquo; Prev</button><button class="p-next-btn">Next &rsaquo;</button></div>
      </div>
      <div class="p-eyebrow"></div>
      <div class="p-cur"></div>
      <div class="p-notes"></div>
      <div class="p-next"></div>
    </div>
  </body></html>`);
  pres.document.close();
  const pd = pres.document;
  const side = pd.querySelector(".p-side");
  sections.forEach((s, i) => {
    const row = pd.createElement("button");
    row.className = "p-nav-row";
    const clone = pd.importNode(s.node, true);
    clone.querySelectorAll(".big-num[data-target]").forEach((n) => (n.textContent = n.dataset.target));
    row.innerHTML = `<div class="p-thumb"><div class="p-thumb-inner"></div></div>
      <div class="p-row-meta"><span class="p-n">${String(i + 1).padStart(2, "0")}</span><span class="p-t">${inline(navLabel(s.data) || "—")}</span></div>`;
    row.querySelector(".p-thumb-inner").appendChild(clone);
    row.addEventListener("click", () => gotoSlide(i));
    side.appendChild(row);
  });
  // the handlers live in THIS window, so they call the deck's own nav
  // functions directly and the stage window is what scrolls
  pd.querySelector(".p-prev").addEventListener("click", () => step(-1));
  pd.querySelector(".p-next-btn").addEventListener("click", () => step(1));
  pres.addEventListener("keydown", (e) => {
    if ([" ", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); step(1); }
    else if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); step(-1); }
    else if (e.key === "Home") { e.preventDefault(); gotoSlide(0); }
    else if (e.key === "End") { e.preventDefault(); gotoSlide(sections.length - 1); }
  });
  const t0 = Date.now();
  const tick = setInterval(() => {
    if (pres.closed) return clearInterval(tick);
    const s = Math.floor((Date.now() - t0) / 1000);
    pd.querySelector(".p-clock").textContent =
      `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);
  updatePresenter();
}
function updatePresenter() {
  if (!pres || pres.closed) return;
  const d = pres.document, cur = sections[activeIdx].data, nxt = sections[activeIdx + 1];
  d.querySelector(".p-eyebrow").textContent = cur.cfg.eyebrow || "";
  d.querySelector(".p-cur").textContent = `${String(activeIdx + 1).padStart(2, "0")} · ${cur.title || "—"}`;
  d.querySelector(".p-notes").innerHTML = cur.notes.length
    ? `<ul>${cur.notes.map((n) => `<li>${inline(n)}</li>`).join("")}</ul>`
    : "<p>— no notes —</p>";
  d.querySelector(".p-next").textContent = nxt ? `next → ${nxt.data.title || navLabel(nxt.data) || "—"}` : "— last slide —";
  d.querySelectorAll(".p-nav-row").forEach((r, i) => {
    const on = i === activeIdx;
    r.classList.toggle("on", on);
    if (on) r.scrollIntoView({ block: "nearest" });
  });
}

// --- scroll loop: spine fill, scrub progress, hash sync --------------------
let currentHash = "";
let activeIdx = 0;
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = scrollY, vh = innerHeight;
    let active = sections[0];
    sections.forEach(({ node }, i) => {
      const p = Math.max(0, Math.min(1, (y + vh - node.offsetTop) / node.offsetHeight));
      segs[i].style.setProperty("--p", p.toFixed(3));
      if (y >= node.offsetTop - vh * 0.4) { active = sections[i]; activeIdx = i; }
      if (node._scrub) {
        const sp = Math.max(0, Math.min(1, (y - node.offsetTop) / (node.offsetHeight - vh)));
        node._scrub.set(sp);
      }
    });
    segs.forEach((sg, i) => sg.classList.toggle("active", sections[i] === active));
    tocRows.forEach((row, i) => row.classList.toggle("active", i === activeIdx));
    groups.forEach((gr) => {
      gr.el.classList.toggle("current", gr.idx.includes(activeIdx));
      const first = sections[gr.idx[0]].node, last = sections[gr.idx.at(-1)].node;
      const total = last.offsetTop + last.offsetHeight - first.offsetTop;
      gr.gsum.style.setProperty("--p", Math.max(0, Math.min(1, (y + vh - first.offsetTop) / total)).toFixed(3));
    });
    updatePager();
    if (active.node.id !== currentHash) {
      currentHash = active.node.id;
      history.replaceState(null, "", `#${currentHash}`);
      updatePresenter();
      shiftBackdrop(activeIdx);
    }
    if (inking) { drawInk(); inkBadge(); }
  });
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => { buildWaypoints(); if (inking) { sizeInk(); drawInk(); } });

// --- reveals + number count-ups --------------------------------------------
// enter past 25% → animate in; fully off-screen → reset, so the entrance
// replays every time the frame comes in (removal happens out of sight, so
// there is never a visible fade-out)
const io = new IntersectionObserver(
  (entries) => {
    for (const e of entries) {
      if (e.isIntersecting && e.intersectionRatio >= 0.25) {
        e.target.classList.add("in");
        e.target.querySelectorAll(".big-num[data-target]").forEach(countUp);
      } else if (!e.isIntersecting) {
        e.target.classList.remove("in");
        e.target.querySelectorAll(".big-num[data-target]").forEach(resetCount);
      }
    }
  },
  { threshold: [0, 0.25] },
);
document.querySelectorAll(".reveal").forEach((n) => io.observe(n));

function resetCount(node) {
  if (isNaN(parseInt(node.dataset.target, 10))) return;
  node._counted = false;
  node.textContent = "0";
}

function countUp(node) {
  if (node._counted) return;
  node._counted = true;
  const target = parseInt(node.dataset.target, 10);
  if (isNaN(target)) { node.textContent = node.dataset.target; return; }
  const t0 = performance.now(), dur = 900;
  (function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    node.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

// --- backdrop: one canvas behind the whole deck ----------------------------
// Ambient, not decorative noise: it holds a state per slide and EASES to the
// next one when the slide changes, so stepping through the deck feels like
// moving through a space rather than swapping posters. Two rules make it
// affordable: (1) nothing animates while a slide is at rest — the rAF loop
// runs only during the ~1s transition, so an idle deck burns zero frames;
// (2) anything expensive is pre-rendered once to an offscreen canvas and
// blitted per frame. Swap the texture and the glow for your own; keep the
// shape of the loop.
const backdrop = document.getElementById("backdrop");
const bctx = backdrop.getContext("2d");
const DOT = 34;                       // texture pitch
let bW = 0, bH = 0, texCanvas = null, glowCanvas = null, accent = "#ffffff";
const bCur = { ox: 0, oy: 0, gx: 0.5, gy: 0.35 };   // texture offset + glow focus
let bTgt = { ...bCur }, bRAF = 0;

function sizeBackdrop() {
  bW = innerWidth; bH = innerHeight;
  backdrop.width = bW; backdrop.height = bH;   // 1× backing store: blurry by design
  accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffffff";
  // texture tile: viewport + one cell of overscan on each side, so the
  // per-slide offset drift can never expose an edge
  texCanvas = texCanvas || document.createElement("canvas");
  const tw = bW + 2 * DOT, th = bH + 2 * DOT;
  texCanvas.width = tw; texCanvas.height = th;
  const tc = texCanvas.getContext("2d");
  tc.fillStyle = "rgba(255,255,255,0.05)";
  for (let y = 0; y < th; y += DOT)
    for (let x = 0; x < tw; x += DOT) { tc.beginPath(); tc.arc(x, y, 1.1, 0, 7); tc.fill(); }
  // accent glow: pre-rendered small (a smooth gradient scales up invisibly),
  // then moved with one cheap drawImage per frame
  const GP = 512;
  glowCanvas = glowCanvas || document.createElement("canvas");
  glowCanvas.width = glowCanvas.height = GP;
  const gc = glowCanvas.getContext("2d");
  const g = gc.createRadialGradient(GP / 2, GP / 2, 0, GP / 2, GP / 2, GP / 2);
  g.addColorStop(0, alpha(accent, 0.14));
  g.addColorStop(0.6, alpha(accent, 0.04));
  g.addColorStop(1, alpha(accent, 0));
  gc.fillStyle = g;
  gc.fillRect(0, 0, GP, GP);
  drawBackdrop();
}
// #rrggbb → rgba()
function alpha(hex, a) {
  const n = parseInt(hex.replace("#", ""), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function drawBackdrop() {
  if (!bW) return;
  bctx.clearRect(0, 0, bW, bH);
  const R = Math.hypot(bW, bH) * 0.9;   // reach across the diagonal; its edge fades out
  bctx.drawImage(glowCanvas, bCur.gx * bW - R, bCur.gy * bH - R, 2 * R, 2 * R);
  bctx.drawImage(texCanvas, -DOT + bCur.ox, -DOT + bCur.oy);
}
function tweenBackdrop() {
  let done = true;
  for (const k of ["ox", "oy", "gx", "gy"]) {
    bCur[k] += (bTgt[k] - bCur[k]) * 0.12;
    if (Math.abs(bTgt[k] - bCur[k]) > 0.003) done = false;
  }
  drawBackdrop();
  if (done) { Object.assign(bCur, bTgt); drawBackdrop(); bRAF = 0; }
  else bRAF = requestAnimationFrame(tweenBackdrop);
}
// deterministic per-slide state — no Math.random, so a given slide always
// looks the same. The glow walks the four corners; the texture drifts.
const CORNERS = [[0, 0], [1, 0], [1, 1], [0, 1]];
function shiftBackdrop(i) {
  const [gx, gy] = CORNERS[((i % 4) + 4) % 4];
  bTgt = {
    ox: (Math.sin(i * 1.7) * 0.5 + 0.5) * DOT,
    oy: (Math.cos(i * 1.1) * 0.5 + 0.5) * DOT,
    gx, gy,
  };
  if (document.documentElement.classList.contains("static")) {
    Object.assign(bCur, bTgt);   // reduced motion: jump, don't ease
    drawBackdrop();
    return;
  }
  if (!bRAF) bRAF = requestAnimationFrame(tweenBackdrop);
}
sizeBackdrop();
addEventListener("resize", sizeBackdrop);

// --- init -------------------------------------------------------------------
buildWaypoints();
onScroll();
// honour an incoming deep link. "instant", not "auto": on a fresh load
// scroll-behavior is still smooth, so "auto" animates all the way down from
// the top — a long scroll that races the mandatory snap and can settle on the
// wrong slide, which is precisely what a shared link must never do
if (location.hash) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) scrollTo({ top: target.offsetTop, behavior: "instant" });
}
</script>
</body>
</html>
