<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Deck — a presentation that is just a web page</title>
<style>
/* ============================================================
   DESIGN TOKENS — the only place visual identity lives.
   Swap this block (or generate it from a design system) to
   rebrand the entire deck.
   ============================================================ */
:root {
  --bg: #05070d;
  --surface: #0c1220;
  --surface-2: #111a2e;
  --line: #1e2a44;
  --text: #e9edf5;
  --muted: #94a0b8;
  --faint: #55617c;
  --accent: #64a2ff;        /* sapphire */
  --accent-soft: #64a2ff22;
  --accent-2: #f5c04e;      /* warm counterpoint, used sparingly */
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  /* deliberately outside the type system: annotation that is ABOUT the deck
     rather than part of it. Still a token, so it stays swappable */
  --font-hand: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
  --radius: 1rem;
  --pad: clamp(2rem, calc(6 * var(--vw)), 6rem);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* two presentation knobs the owner can dial without touching layout code:
     body/card/label text size (headings deliberately excluded — the type
     scale owns those) and entrance-animation pace. A deck read from the back
     of a large room wants --text-scale ~1.3; a fast talker wants ~0.7 pace */
  --text-scale: 1;
  --transition-scale: 1;
  /* viewport units as tokens — never used raw in layout rules. The
     interactive print preview resolves vw/vh against the printer's paper
     size, not the @page px box (same family as the media-query print
     gotcha), so print pins these to the page's px size instead */
  --vw: 1vw;
  --vh: 1vh;
  --vmax: 1vmax;
}

/* ============================================================
   BASE — full-bleed presentation canvas, not a web page.
   ============================================================ */
* { box-sizing: border-box; margin: 0; }
/* free scrolling settles on the same stops the keyboard uses: sections snap
   to start, scrub stages snap via markers placed at the waypoint offsets */
html { scroll-behavior: smooth; scroll-snap-type: y mandatory; }
html.static { scroll-behavior: auto; scroll-snap-type: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
  overflow-x: hidden;
}
section {
  position: relative;
  min-height: calc(100 * var(--vh));
  width: 100%;
  display: grid;
  /* slide anatomy: header row at the top, body fills the rest */
  grid-template-rows: auto 1fr;
  padding: var(--pad);
  /* clip (not hidden): hidden creates a scroll container, which breaks
     position: sticky for the scrub stage */
  overflow: clip;
  scroll-snap-align: start;
}
/* statement slides (hero, closing) stay vertically centered */
section.center { grid-template-rows: none; align-content: center; }
/* body content sits comfortably in the remaining space… */
section > :not(header) { align-self: center; }
/* …except grids, which stretch to use the available height */
section > .grid { align-self: stretch; align-content: stretch; grid-auto-rows: 1fr; }
/* decorative glow blobs — alternate corners per section. On screen the
   backdrop canvas does this job (and moves between slides), so these are the
   static stand-in for print/reduced-motion, where the canvas is hidden */
section::before {
  content: "";
  display: none;
  position: absolute;
  width: calc(55 * var(--vmax)); height: calc(55 * var(--vmax));
  border-radius: 50%;
  filter: blur(90px);
  background: radial-gradient(circle, var(--accent-soft), transparent 65%);
  top: calc(-20 * var(--vmax)); left: calc(-15 * var(--vmax));
  pointer-events: none;
}
section:nth-of-type(even)::before {
  top: auto; left: auto; bottom: calc(-20 * var(--vmax)); right: calc(-15 * var(--vmax));
  background: radial-gradient(circle, #f5c04e14, transparent 65%);
}
html.static section::before { display: block; }

/* ============================================================
   TYPOGRAPHY — heading levels govern the scale.
   #  (deck title)     → .t1
   ## (section title)  → .t2
   ### (item heading)  → .t3
   ============================================================ */
.t1 { font-size: clamp(3.5rem, calc(9 * var(--vw)), 8rem);   font-weight: 800; letter-spacing: -0.03em; line-height: 1.0; }
.t2 { font-size: clamp(2.2rem, calc(5 * var(--vw)), 4.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.t3 { font-size: clamp(1.05rem, calc(1.6 * var(--vw)), 1.4rem); font-weight: 600; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: clamp(0.7rem, calc(1 * var(--vw)), 0.85rem);
  text-transform: uppercase; letter-spacing: 0.25em;
  color: var(--accent);
  margin-bottom: 1.2rem;
}
.lede {
  font-size: calc(clamp(1.1rem, calc(1.8 * var(--vw)), 1.5rem) * var(--text-scale));
  color: var(--muted);
  max-width: 58ch;              /* line length constrained locally, never globally */
  margin-top: 1.5rem;
}
.lede strong, .card p strong { color: var(--text); }
code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 0.35em;
  padding: 0.1em 0.4em;
}
kbd {
  font-family: var(--font-mono);
  font-size: 0.85em;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 0.4em;
  background: var(--surface);
  padding: 0.15em 0.55em;
}

/* ============================================================
   COMPONENTS
   ============================================================ */
.card {
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(1.2rem, calc(2 * var(--vw)), 2rem);
  backdrop-filter: blur(6px);
}
.card p { color: var(--muted); margin-top: 0.6rem; font-size: calc(clamp(0.95rem, calc(1.3 * var(--vw)), 1.1rem) * var(--text-scale)); }
.card ul { list-style: none; padding: 0; margin-top: 0.6rem; }
.card li {
  position: relative;
  padding-left: 1.1rem;
  margin-top: 0.4rem;
  color: var(--muted);
  font-size: calc(clamp(0.85rem, calc(1.1 * var(--vw)), 1rem) * var(--text-scale));
}
.card li::before {
  content: "";
  position: absolute;
  left: 0; top: 0.55em;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(20rem, 100%), 1fr));
  gap: clamp(1rem, calc(2 * var(--vw)), 1.75rem);
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
}

/* reveal-on-entry animation — replays each time the frame comes in:
   .in is added when the element enters and removed once fully off-screen */
.reveal {
  --dur: calc(0.6s * var(--transition-scale));
  opacity: 0;
  transform: translateY(26px) scale(0.985);
  filter: blur(10px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), filter var(--dur) var(--ease);
  transition-delay: calc(var(--d, 0s) * var(--transition-scale));
}
.reveal.in { opacity: 1; transform: none; filter: none; }

/* hero */
.hero-hint {
  margin-top: 3.5rem;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: 0.35; } }

/* scrubbed sequence: tall wrapper + pinned stage */
.scrub .stage {
  position: sticky;
  top: 0;
  min-height: calc(100 * var(--vh));
  display: grid;
  grid-template-rows: auto 1fr;
  padding: var(--pad);
}
.stage > .seq { align-self: center; }
/* align-content: start — the base section's align-content: center applies to
   block containers too (Chrome 123+), which would rest the sticky stage in the
   middle of the tall wrapper instead of pinning from the top.
   scroll-snap-align: none — the wrapper must not snap as a whole or mid-scrub
   positions become unrestable; its .snap-marker children snap per stage. */
.scrub { padding: 0; display: block; align-content: start; scroll-snap-align: none; }
.snap-marker { position: absolute; left: 0; width: 1px; height: 1px; scroll-snap-align: start; }
html.static .snap-marker { display: none; }
.seq { margin-top: clamp(2rem, calc(5 * var(--vh)), 4rem); }
.track {
  height: 3px; border-radius: 2px; background: var(--line);
  overflow: hidden;
}
.track .fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.35s var(--ease);
}
.chips {
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  gap: clamp(0.75rem, calc(1.5 * var(--vw)), 1.5rem);
  margin-top: clamp(1rem, calc(2.5 * var(--vh)), 1.5rem);
}
.chip {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: clamp(0.9rem, calc(1.5 * var(--vw)), 1.4rem);
  font-family: var(--font-mono);
  font-size: clamp(0.85rem, calc(1.2 * var(--vw)), 1.05rem);
  color: var(--faint);
  transition: color 0.4s, border-color 0.4s, background 0.4s, transform 0.4s var(--ease);
  transform: translateY(6px);
}
.chip.on {
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  background: var(--accent-soft);
  transform: none;
}
.chip .idx { color: var(--accent); margin-right: 0.6em; }
.blurb {
  margin-top: clamp(1rem, calc(3.5 * var(--vh)), 2rem);
  min-height: 2.6em;
  max-width: 62ch;
  font-size: clamp(1rem, calc(1.5 * var(--vw)), 1.3rem);
  color: var(--muted);
}
.blurb .head { color: var(--accent); font-family: var(--font-mono); margin-right: 0.8em; }
.blurb.swap { animation: swap 0.35s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(8px); } }
.static-stages { display: none; }

/* numbers */
.numbers-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));
  gap: clamp(1.5rem, calc(3 * var(--vw)), 3rem);
  margin-top: clamp(2.5rem, calc(6 * var(--vh)), 5rem);
}
.big-num {
  font-size: clamp(4rem, calc(10 * var(--vw)), 9rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.big-label { color: var(--muted); margin-top: 0.5rem; font-size: calc(clamp(1rem, calc(1.4 * var(--vw)), 1.25rem) * var(--text-scale)); }
/* @hero: yes — the first stat takes the full top row, oversized: one headline
   number with supporting stats beneath it, instead of a flat row of equals */
.numbers-row:has(.num-hero) { grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr)); }
.num-hero { grid-column: 1 / -1; }
.num-hero .big-num { font-size: clamp(5rem, calc(15 * var(--vw)), 14rem); }
.num-hero .big-label { font-size: calc(clamp(1.15rem, calc(1.9 * var(--vw)), 1.6rem) * var(--text-scale)); max-width: 40ch; }

/* mirror (source next to rendered) */
.mirror-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(26rem, 100%), 1fr));
  gap: clamp(1.5rem, calc(3 * var(--vw)), 3rem);
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
  align-items: start;
}
.mirror-grid pre {
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, calc(1 * var(--vw)), 0.95rem);
  line-height: 1.7;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(1.2rem, calc(2 * var(--vw)), 2rem);
  overflow-x: auto;
  white-space: pre-wrap;
}
.mirror-grid pre .md-h { color: var(--accent); }
.mirror-grid pre .md-cfg { color: var(--accent-2); }

/* ---- layout library ---- */

/* media: text + image */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(24rem, 100%), 1fr));
  gap: clamp(2rem, calc(4 * var(--vw)), 4rem);
  align-items: center;
}
.media-grid.flip > :first-child { order: 2; }
.media-frame {
  aspect-ratio: 16 / 9;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.media-frame img, .media-frame svg { width: 100%; height: 100%; object-fit: cover; display: block; }

/* compact cards for dense grids (@cols >= 4) */
.card--sm { padding: clamp(0.8rem, calc(1.2 * var(--vw)), 1.2rem); }
.card--sm .t3 { font-size: clamp(0.95rem, calc(1.3 * var(--vw)), 1.15rem); }
.card--sm p { font-size: clamp(0.8rem, calc(1 * var(--vw)), 0.95rem); margin-top: 0.3rem; }

/* diagram: linear flow of nodes */
.flow {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: clamp(0.6rem, calc(1.2 * var(--vw)), 1.2rem);
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
}
.flow .node { flex: 1 1 9rem; }
.node-head { font-family: var(--font-mono); font-size: clamp(0.85rem, calc(1.1 * var(--vw)), 1rem); color: var(--accent); }
.flow .node p { font-size: clamp(0.8rem, calc(1 * var(--vw)), 0.95rem); }
.flow-arrow { align-self: center; color: var(--faint); font-size: clamp(1.2rem, calc(2 * var(--vw)), 1.8rem); user-select: none; }

/* timeline: gantt-like bars on a unit grid */
.timeline { margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem); }
.tl-row {
  display: grid;
  grid-template-columns: clamp(8rem, calc(16 * var(--vw)), 13rem) 1fr;
  align-items: center;
  margin-top: 0.8rem;
}
.tl-label { font-size: clamp(0.85rem, calc(1.2 * var(--vw)), 1rem); color: var(--muted); padding-right: 1rem; }
.tl-labels {
  display: grid;
  grid-template-columns: repeat(var(--l), 1fr);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--faint);
}
.tl-track {
  position: relative;
  height: clamp(1.6rem, calc(3.5 * var(--vh)), 2.1rem);
  border-radius: 0.45rem;
  background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / var(--u)));
}
.tl-bar {
  position: absolute;
  top: 0.2rem; bottom: 0.2rem;
  border-radius: 0.35rem;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  display: flex;
  align-items: center;
  padding: 0 0.6rem;
  /* bars extend left → right when the frame comes in (row inherits --d) */
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.7s var(--ease);
  transition-delay: calc(var(--d, 0s) + 0.2s);
}
.tl-row.in .tl-bar { transform: none; }
.tl-bar span {
  font-size: 0.72rem;
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* label fades in once the bar has mostly grown, hiding the scale squish */
  opacity: 0;
  transition: opacity 0.3s;
  transition-delay: calc(var(--d, 0s) + 0.75s);
}
.tl-row.in .tl-bar span { opacity: 1; }
html.static .tl-bar { transform: none; transition: none; }
html.static .tl-bar span { opacity: 1; transition: none; }

/* funnel: centered narrowing stages, width proportional to value */
.funnel {
  display: grid;
  gap: clamp(0.5rem, calc(1.2 * var(--vh)), 0.9rem);
  justify-items: center;
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
}
.fun-row { width: calc(var(--w) * 1%); min-width: 14rem; }
.fun-bar {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 0.7rem;
  padding: clamp(0.7rem, calc(1.6 * var(--vh)), 1.1rem) 1rem;
  border-radius: 0.6rem;
}
.fun-bar em { font-style: normal; font-weight: 600; color: var(--text); font-size: clamp(0.85rem, calc(1.1 * var(--vw)), 1rem); }
.fun-bar strong { font-family: var(--font-mono); font-size: clamp(1rem, calc(1.5 * var(--vw)), 1.4rem); }
.fun-bar span { color: var(--muted); font-size: clamp(0.8rem, calc(1 * var(--vw)), 0.95rem); white-space: nowrap; }

/* logos: social-proof wall; images grayscale, text fallback as wordmarks */
.logos { display: grid; gap: clamp(1rem, calc(2 * var(--vw)), 2rem); margin-top: clamp(2.5rem, calc(5 * var(--vh)), 4rem); }
.logo-cell {
  display: grid;
  place-items: center;
  min-height: clamp(4rem, calc(11 * var(--vh)), 6.5rem);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 60%, transparent);
}
.logo-cell img { max-height: 2.2rem; max-width: 60%; filter: grayscale(1) brightness(1.6); opacity: 0.75; transition: 0.25s; }
.logo-cell:hover img { filter: none; opacity: 1; }
.logo-cell span { font-weight: 800; letter-spacing: 0.04em; color: var(--muted); font-size: clamp(1rem, calc(1.4 * var(--vw)), 1.3rem); }

/* quadrant: 2×2 positioning chart; items plot on a 0–10 grid */
.quad-wrap {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.6rem;
  height: min(calc(58 * var(--vh)), 34rem);
  margin-top: clamp(1.5rem, calc(3 * var(--vh)), 3rem);
}
.quad {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat,
    linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat;
}
.quad-dot { display: flex; align-items: center; gap: 0.45rem; }
.quad-dot i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.quad-dot span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text); white-space: nowrap; }
.quad-x, .quad-y { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.quad-x { grid-column: 2; text-align: center; margin-top: 0.5rem; }
.quad-y { writing-mode: sideways-lr; text-align: center; }
.quad-corner {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--faint);
  padding: 0.6rem 0.9rem;
}

/* chart: single-series bar chart from `label / value` items — no library */
.chart {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  align-items: end;
  gap: clamp(1rem, calc(2.5 * var(--vw)), 2.5rem);
  height: min(calc(52 * var(--vh)), 30rem);
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
}
.chart .col { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 0.6rem; text-align: center; }
.chart .bar-wrap { display: grid; align-items: end; padding-top: 1.8rem; }
.chart .bar {
  position: relative;
  height: calc(var(--v) * 1%);
  border-radius: 0.5rem 0.5rem 0 0;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 45%, var(--bg)));
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.7s var(--ease);
  transition-delay: var(--d, 0s);
}
.chart .reveal.in .bar { transform: none; }
.chart .val {
  position: absolute;
  top: -1.7rem;
  width: 100%;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
  transition-delay: calc(var(--d, 0s) + 0.5s);
}
.chart .reveal.in .val { opacity: 1; }
.chart .lab { color: var(--muted); font-size: clamp(0.8rem, calc(1 * var(--vw)), 0.95rem); }
html.static .chart .bar { transform: none; transition: none; }
html.static .chart .val { opacity: 1; transition: none; }

/* quote: full-bleed pull-quote with attribution */
.quote-mark { font-family: Georgia, serif; font-size: clamp(4rem, calc(9 * var(--vw)), 8rem); line-height: 0.4; color: var(--accent); }
.quote-text {
  font-size: clamp(1.6rem, calc(3.2 * var(--vw)), 3rem);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.25;
  max-width: 26ch;
}
.quote-cite { display: flex; align-items: center; gap: 1rem; margin-top: clamp(1.5rem, calc(4 * var(--vh)), 2.5rem); }
.quote-cite .qc-name { font-weight: 700; }
.quote-cite .qc-role { color: var(--muted); font-size: 0.9rem; }

/* compare: two panels with a vs seam; @winner highlights one side */
.compare {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(1.5rem, calc(3 * var(--vw)), 3rem);
  align-items: stretch;
  margin-top: clamp(2rem, calc(4 * var(--vh)), 4rem);
}
.compare .vs {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
  display: grid; place-items: center;
  width: clamp(2.6rem, calc(3.4 * var(--vw)), 3.4rem);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font: 700 clamp(0.8rem, calc(1 * var(--vw)), 1rem) var(--font-mono);
  color: var(--accent);
}
.compare .card.win { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: var(--accent-soft); }
@media screen and (max-width: 56rem) { .compare { grid-template-columns: 1fr; } .compare .vs { display: none; } }

/* agenda: auto-generated from chapter dividers, click to jump */
.agenda {
  display: grid;
  gap: clamp(1rem, calc(2.5 * var(--vh)), 2rem);
  align-content: center;
  max-width: 60rem;
}
.agenda a {
  display: grid;
  grid-template-columns: 4rem 1fr;
  align-items: baseline;
  text-decoration: none;
  color: var(--text);
  border-bottom: 1px solid var(--line);
  padding-bottom: clamp(0.6rem, calc(1.5 * var(--vh)), 1rem);
}
.agenda .a-n { font-family: var(--font-mono); color: var(--accent); font-size: clamp(1rem, calc(1.4 * var(--vw)), 1.3rem); }
.agenda .a-t { font-size: clamp(1.4rem, calc(2.6 * var(--vw)), 2.4rem); font-weight: 700; letter-spacing: -0.01em; transition: color 0.2s; }
.agenda a:hover .a-t { color: var(--accent); }

/* cycle: items on a ring, read clockwise. Node/arrow positions come from
   the renderer as left/top percentages; .cyc-pos centers each on its point
   so the inner .reveal keeps its own transform for the entrance */
.cycle {
  position: relative;
  aspect-ratio: 1;
  height: min(calc(62 * var(--vh)), 36rem);
  margin-inline: auto;
}
.cyc-ring {
  position: absolute;
  inset: 13%;
  border: 2px dashed var(--line);
  border-radius: 50%;
}
.cyc-pos { position: absolute; transform: translate(-50%, -50%); }
.cyc-node {
  width: max-content;
  max-width: clamp(11rem, calc(16 * var(--vw)), 15rem);
  text-align: center;
}
.cyc-node p { font-size: clamp(0.8rem, calc(1 * var(--vw)), 0.95rem); }
.cyc-arrow {
  display: block;
  color: var(--accent);
  font-size: clamp(1rem, calc(1.6 * var(--vw)), 1.4rem);
  user-select: none;
}

/* relations: entities on a ring, labelled edges as chords underneath */
.rel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rel line { stroke: var(--faint); stroke-width: 0.35; }
.rel marker path { fill: var(--faint); }
.rel-label {
  display: block;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 0.35rem;
  padding: 0.08rem 0.4rem;
}

/* team: people cards with generated avatars */
.person { display: flex; gap: 1rem; align-items: center; }
.person p { margin-top: 0.15rem; }
.avatar { flex-shrink: 0; border-radius: 50%; }
img.avatar { object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); }

/* profile: one-pager — avatar + name in the header, body below it */
.profile-id {
  display: flex;
  align-items: center;
  gap: clamp(1rem, calc(2 * var(--vw)), 1.75rem);
  margin-top: 0.75rem;
}
.profile-body {
  display: grid;
  grid-template-columns: 2fr 3fr;
  gap: clamp(2rem, calc(4 * var(--vw)), 4rem);
  align-items: start;
}
/* screen-scoped: print media queries evaluate against the printer's default
   page size, not the @page px size, so an unscoped max-width would falsely
   stack the columns in the PDF */
@media screen and (max-width: 56rem) { .profile-body { grid-template-columns: 1fr; } }
.profile-role { color: var(--accent); font-family: var(--font-mono); margin-top: 0.4rem; }
.profile-cols { display: grid; gap: clamp(0.8rem, calc(1.5 * var(--vw)), 1.25rem); }
.profile-h {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--accent);
}
.profile-cols ul, .tier ul { list-style: none; padding: 0; margin-top: 0.6rem; }
.profile-cols li, .tier li {
  position: relative;
  padding-left: 1.3rem;
  margin-top: 0.45rem;
  color: var(--muted);
  font-size: clamp(0.85rem, calc(1.1 * var(--vw)), 1rem);
}
.profile-cols li::before {
  content: "";
  position: absolute;
  left: 0; top: 0.55em;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* pricing / commercials */
.tier { position: relative; display: flex; flex-direction: column; }
.tier-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--accent);
}
.tier-price {
  font-size: clamp(1.5rem, calc(2.8 * var(--vw)), 2.4rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0.6rem 0 0.4rem;
}
.tier li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
.tier.featured {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  background: var(--accent-soft);
}
.tier-badge {
  position: absolute;
  top: -0.75rem; right: 1rem;
  background: var(--accent);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.6rem;
  border-radius: 0.5rem;
}

/* ---- chrome tour: annotate the deck's OWN persistent UI ----
   The targets are real fixed elements at the edges of the viewport, so the
   notes are absolutely positioned in the section and aimed at them with
   hand-drawn arrows. Aimed, not touching — that is how a person annotates a
   screenshot, and it survives the viewport being a different shape. */
.cx-defs { position: absolute; width: 0; height: 0; }
/* the top-right corner belongs to the pager note and its arrow — constrain
   the header rather than tuning a path against one particular title, or a
   longer heading will run underneath the annotation */
.chrome-tour header { max-width: 62%; }
.chrome-tour { --cx-w: clamp(11rem, calc(16 * var(--vw)), 17rem); }
.cx-note { position: absolute; width: var(--cx-w); z-index: 2; }
.cx-arrow { position: absolute; overflow: visible; }
.cx-arrow path { fill: none; stroke: var(--accent-2); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.cx-h {
  font-family: var(--font-hand);
  font-size: calc(clamp(1.15rem, calc(1.75 * var(--vw)), 1.6rem) * var(--text-scale));
  color: var(--accent-2);
}
.cx-note p {
  color: var(--muted);
  margin-top: 0.3rem;
  font-size: calc(clamp(0.85rem, calc(1.1 * var(--vw)), 1.02rem) * var(--text-scale));
}
/* One rule per target: where the note sits, and where its arrow hangs off it.
   The targets are pinned to the VIEWPORT EDGES at fixed offsets, so the notes
   and arrow lengths are in rem too — a percentage inset drifts away from its
   target as the window grows, which a fixed-length arrow cannot follow. */
.cx-spine { left: 10rem; top: 44%; }
.cx-spine .cx-arrow { right: 100%; top: -0.6rem; width: 8rem; height: 4.4rem; }
/* the exception: the chips sit at the CENTRE while the note sits at the right
   edge, so this gap alone scales with the viewport. The arrow spans it in
   viewport units and stretches (preserveAspectRatio="none") rather than
   letterboxing. 95vw − note − width puts its LEFT EDGE exactly on 50vw, so a
   path ending at viewBox x=0 lands on the chips' precise centre at every
   window size — the one anchor that needs no tuning. Drop below the pill
   before turning up, or the head parks inside it and the pill hides it */
.cx-pager { right: calc(5 * var(--vw)); top: 12rem; text-align: center; }
.cx-pager .cx-arrow { right: 100%; bottom: 100%; width: calc(45 * var(--vw) - var(--cx-w)); height: 8rem; }
.cx-footer-brand { left: 11rem; bottom: 9rem; }
.cx-footer-brand .cx-arrow { left: -1.5rem; top: 100%; width: 8rem; height: 5.5rem; }
/* centred with a margin, NOT translateX(-50%): these notes carry .reveal, and
   .reveal.in { transform: none } outranks a class selector and would drop it */
.cx-footer-title { left: 50%; margin-left: calc(var(--cx-w) / -2); bottom: 16rem; text-align: center; }
.cx-footer-title .cx-arrow { left: 50%; margin-left: -2.2rem; top: 100%; width: 4.4rem; height: 11.5rem; }
.cx-footer-page { right: 9rem; bottom: 9rem; text-align: right; }
.cx-footer-page .cx-arrow { right: -1.5rem; top: 100%; width: 8rem; height: 5.5rem; }
@media screen and (max-width: 60rem) {
  /* the chrome is still there, but there is no room to point at it politely */
  .cx-note { position: static; width: auto; margin: 1rem 0 0; text-align: left; }
  .cx-arrow { display: none; }
}
/* print and reduced motion hide the spine and pager, so the arrows would aim
   at nothing — draw a faint stand-in for each, shown only in static mode */
.cx-ghost { position: absolute; display: none; border: 1px dashed var(--line); border-radius: 999px; }
html.static .cx-ghost { display: block; }
.cx-ghost-spine { left: clamp(0.6rem, calc(1.2 * var(--vw)), 1.4rem); top: 15%; width: 10px; height: 70%; }
.cx-ghost-pager { left: 50%; transform: translateX(-50%); top: clamp(0.9rem, calc(2.2 * var(--vh)), 1.6rem); width: 9rem; height: 1.9rem; }

/* blank: holding slide — a centred prompt and nothing else, so the room sees
   no content until you advance off it */
.begin {
  font-family: var(--font-mono);
  font-size: clamp(1.2rem, calc(2.4 * var(--vw)), 2.2rem);
  letter-spacing: 0.3em;
  color: var(--faint);
  text-align: center;
}

/* @note: — the aside that is neither a bullet nor a speaker note. A single
   accented strip along the bottom of the slide body */
.foot-note {
  margin-top: clamp(1.2rem, calc(3 * var(--vh)), 2rem);
  border-left: 3px solid var(--accent);
  padding: 0.55rem 0 0.55rem 1rem;
  max-width: 90ch;
  color: var(--muted);
  font-size: calc(clamp(0.9rem, calc(1.2 * var(--vw)), 1.05rem) * var(--text-scale));
}
.foot-note strong { color: var(--text); }

/* item sub-directives (`map:` / `flow:` lines in an item's body) */
.card-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.7rem; }
.k-then { font-family: var(--font-mono); font-size: 0.7rem; color: var(--faint); }
.card-keys kbd {
  font-size: calc(0.85rem * var(--text-scale));
  padding: 0.2em 0.65em;
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}
.map-tag {
  margin-top: 0.9rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.mini-flow { margin-top: 1rem; display: grid; gap: 0.35rem; justify-items: center; }
.mf-stage { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
.mf-chip {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 0.24rem 0.62rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
}
.mf-out .mf-chip { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.mf-arrow { color: var(--accent); font-weight: 700; line-height: 0.9; }

/* @balance: yes — cards keep their natural height and the whole grid centres
   in the leftover space, with map tags flush to each card's bottom edge.
   The default (stretch) is right for even content; this is right when one
   card is much shorter than the others and stretching looks broken */
.grid.balanced { align-self: center; align-content: center; grid-auto-rows: auto; }
.grid.balanced .card { display: flex; flex-direction: column; }
.grid.balanced .map-tag { margin-top: auto; padding-top: 0.9rem; }

/* diagram @fork: k — the last k nodes stack after the final arrow, so a flow
   can end in parallel outputs instead of one more box in the line */
.flow .fork { display: grid; gap: clamp(0.6rem, calc(1.2 * var(--vw)), 1.2rem); flex: 1 1 12rem; }

/* formula: ingredient cards joined by +, resolving to = a highlighted result */
.formula .op {
  align-self: center;
  color: var(--accent);
  font: 700 clamp(1.4rem, calc(2.6 * var(--vw)), 2.4rem) var(--font-mono);
  user-select: none;
}
.formula .node.result { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: var(--accent-soft); }
.formula .node.result .node-head { color: var(--text); }

/* contract: paired rows under a two-column header — what each side gives */
.contract { display: grid; gap: clamp(0.6rem, calc(1.4 * var(--vh)), 1rem); margin-top: clamp(1.5rem, calc(3 * var(--vh)), 2.5rem); }
.con-head, .con-row {
  display: grid;
  grid-template-columns: clamp(9rem, calc(18 * var(--vw)), 15rem) 1fr 1fr;
  gap: clamp(0.6rem, calc(1.2 * var(--vw)), 1.2rem);
  align-items: stretch;
}
.con-head span {
  font: 700 0.7rem var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--faint);
  padding-bottom: 0.3rem;
}
.con-head .we-h { color: var(--accent); }
.con-name { display: flex; align-items: center; gap: 0.7rem; }
.con-name .n { font-family: var(--font-mono); color: var(--accent); font-size: 0.85rem; }
.con-we { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
@media screen and (max-width: 60rem) { .con-head { display: none; } .con-row { grid-template-columns: 1fr; } }

/* bands: horizontal range bars with a median marker. @min/@max scale the
   axis; @relative reads each median as a % against the @baseline row */
.bands { display: grid; gap: clamp(0.6rem, calc(1.6 * var(--vh)), 1.1rem); margin-top: clamp(1.5rem, calc(3.5 * var(--vh)), 3rem); }
.band-row {
  display: grid;
  grid-template-columns: clamp(9rem, calc(18 * var(--vw)), 15rem) 1fr clamp(4rem, calc(7 * var(--vw)), 6rem);
  gap: clamp(0.6rem, calc(1.2 * var(--vw)), 1.2rem);
  align-items: center;
}
.band-label { font-size: calc(clamp(0.85rem, calc(1.2 * var(--vw)), 1rem) * var(--text-scale)); color: var(--muted); }
.band-row.hi .band-label { color: var(--text); font-weight: 700; }
.band-track {
  position: relative;
  height: clamp(1.4rem, calc(3 * var(--vh)), 1.9rem);
  border-radius: 0.4rem;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid var(--line);
}
.band-bar {
  position: absolute; top: 0.2rem; bottom: 0.2rem;
  border-radius: 0.3rem;
  background: color-mix(in srgb, var(--accent) 30%, var(--surface));
  /* bars grow from their low end when the row enters (row carries --d) */
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.6s var(--ease);
  transition-delay: calc(var(--d, 0s) + 0.15s);
}
.band-row.hi .band-bar { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
.band-row.in .band-bar { transform: none; }
.band-med {
  position: absolute; top: 0.05rem; bottom: 0.05rem;
  width: 3px; border-radius: 2px; background: var(--accent);
  opacity: 0; transition: opacity 0.3s; transition-delay: calc(var(--d, 0s) + 0.6s);
}
.band-row.in .band-med { opacity: 1; }
.band-e {
  position: absolute; top: 100%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 0.62rem; color: var(--faint); white-space: nowrap;
}
.band-val { font-family: var(--font-mono); font-size: clamp(0.8rem, calc(1.1 * var(--vw)), 1rem); color: var(--muted); text-align: right; }
.band-row.hi .band-val { color: var(--accent); font-weight: 700; }
html.static .band-bar { transform: none; transition: none; }
html.static .band-med { opacity: 1; transition: none; }

/* ---- ticker scrubs: a numbered ticker beside a figure that animates ----
   morph, radar and matrix all share this skeleton — the rows light up one
   at a time while the figure advances. New scrubbed data-visual = a new
   figure builder, not a new scroll engine. */
.fig-grid {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: clamp(1.5rem, calc(3 * var(--vw)), 3rem);
  align-items: center;
  margin-top: clamp(1.5rem, calc(3 * var(--vh)), 3rem);
}
@media screen and (max-width: 60rem) { .fig-grid { grid-template-columns: 1fr; } }
.ticks { display: grid; gap: clamp(0.5rem, calc(1.2 * var(--vh)), 0.9rem); align-content: center; }
.tick {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.9rem;
  padding: clamp(0.6rem, calc(1.1 * var(--vw)), 1rem);
  border: 1px solid transparent;
  border-radius: var(--radius);
  /* rows slide in from the left as they light up, and dim back on reverse */
  opacity: 0.25;
  transform: translateX(-14px);
  transition: opacity 0.45s var(--ease), transform 0.45s var(--ease), background 0.45s, border-color 0.45s;
}
.tick.on { opacity: 1; transform: none; }
.tick.now { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tk-i { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); }
.tk-h { font-weight: 600; font-size: calc(clamp(0.95rem, calc(1.3 * var(--vw)), 1.15rem) * var(--text-scale)); }
.tick p { color: var(--muted); margin-top: 0.25rem; font-size: calc(clamp(0.82rem, calc(1.05 * var(--vw)), 0.98rem) * var(--text-scale)); }
html.static .tick { opacity: 1; transform: none; transition: none; }
.fig-wrap { display: grid; justify-items: center; gap: 0.8rem; }
.fig-wrap svg { width: 100%; max-height: min(calc(52 * var(--vh)), 30rem); overflow: visible; }
.fig-cap {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--faint);
  text-align: center;
}
.fig-wrap polygon.morph { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }

/* radar: rings/axes/labels are the static frame, one polygon per profile */
.radar-ring, .radar-axis { fill: none; stroke: var(--line); stroke-width: 0.5; }
.radar-label { font-family: var(--font-mono); font-size: 4px; fill: var(--faint); }
.radar-data { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; transition: none; }

/* matrix: coverage heatmap — cells fade in per column, values morph per
   stage, and a labelled window slides across to meet them */
.mx-bg { fill: var(--surface); opacity: 0; }
.mx-cell { fill: var(--accent); opacity: 0; }
.mx-axis { font-family: var(--font-mono); font-size: 11px; fill: var(--faint); }
.mx-window rect { fill: none; stroke: var(--accent-2); stroke-width: 2; stroke-dasharray: 5 4; }
.mx-window text { font-family: var(--font-mono); font-size: 12px; fill: var(--accent-2); }
.mx-window.met rect { stroke-dasharray: none; }

/* orbit: a centre node with a ring of cards turning slowly around it. The
   rotor spins, each card counter-rotates by the same amount so it stays
   upright — one animation, no per-card math */
.orbit { position: relative; aspect-ratio: 1; height: min(calc(58 * var(--vh)), 34rem); margin-inline: auto; }
.orb-ring { position: absolute; inset: 10%; border: 2px dashed var(--line); border-radius: 50%; }
.orb-rotor { position: absolute; inset: 0; animation: orbit 60s linear infinite; }
.orb-counter { animation: orbit 60s linear infinite reverse; }
@keyframes orbit { to { transform: rotate(360deg); } }
html.static .orb-rotor, html.static .orb-counter { animation: none; }
.orb-pos { position: absolute; transform: translate(-50%, -50%); }
.orb-node { width: max-content; max-width: 11rem; text-align: center; padding: 0.7rem 0.9rem; }
.orb-node .t3 { font-size: clamp(0.9rem, calc(1.2 * var(--vw)), 1.05rem); }
.orb-role { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
.orb-avatar {
  display: grid; place-items: center;
  width: 2.6rem; height: 2.6rem;
  margin: 0 auto 0.45rem;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font: 700 0.85rem var(--font-mono);
  color: var(--accent);
  overflow: hidden;
}
.orb-avatar img { width: 100%; height: 100%; object-fit: cover; }
.orb-center { width: max-content; max-width: 11rem; text-align: center; }
.orb-center .t3 { color: var(--accent); }

/* shapes: static side-by-side profile comparison — the un-scrubbed
   counterpart to radar, for when the point is contrast, not change */
.shapes-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(13rem, 100%), 1fr));
  gap: clamp(1rem, calc(2 * var(--vw)), 2rem);
  margin-top: clamp(1.5rem, calc(3 * var(--vh)), 3rem);
}
.shape-card { text-align: center; }
.shape-card svg { width: 100%; max-height: min(calc(30 * var(--vh)), 15rem); overflow: visible; }
.shape-card.muted .radar-data { fill: none; stroke: var(--faint); }
.shape-name { font-weight: 700; margin-top: 0.5rem; }
.shape-card.answer .shape-name { color: var(--accent); }
.shape-desc { color: var(--muted); margin-top: 0.35rem; font-size: calc(clamp(0.82rem, calc(1.05 * var(--vw)), 0.98rem) * var(--text-scale)); }

/* media @panel: — the right side becomes a card of numbered rows instead of
   an image, for a list that should read as a figure */
.panel-h {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 0.9rem;
}
.panel-row { display: grid; grid-template-columns: auto 1fr; gap: 0.9rem; align-items: baseline; padding: 0.5rem 0; border-top: 1px solid var(--line); }
.panel-row:first-of-type { border-top: 0; }
.panel-row .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--faint); }
.panel-row .t { font-size: calc(clamp(0.95rem, calc(1.3 * var(--vw)), 1.15rem) * var(--text-scale)); }

/* ============================================================
   BACKDROP — one fixed canvas behind every slide, holding a
   per-slide state that eases to a new one when the slide
   changes. Idle burns no frames: the rAF loop only runs during
   the ~1s transition. Hidden in overview and print.
   ============================================================ */
#backdrop {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
/* z-index 0 + placed before <main> in the DOM: sections are positioned with
   z-index auto, so they paint in the same layer, after it. Giving sections an
   explicit z-index instead would trap the comment pins under the ink canvas */
html.overview #backdrop { display: none; }

/* vignette: a soft accent rim hugging the viewport edge. A real element, not
   body::after, so it can't leak into the presenter window's copy of this CSS */
#vignette {
  position: fixed; inset: 0; z-index: 400;
  pointer-events: none;
  transition: box-shadow 0.5s var(--ease);
  box-shadow:
    inset 0 0 clamp(4rem, 9vmin, 8rem) color-mix(in srgb, var(--accent) 14%, transparent),
    inset 0 0 clamp(1.2rem, 3vmin, 2.5rem) color-mix(in srgb, var(--accent) 10%, transparent);
}
html.overview #vignette { display: none; }

/* deck footer: brand · presentation title · page number, on every slide.
   Rendered per-section (absolute, inside the sticky stage for scrubs) rather
   than position: fixed, so each printed page carries its own page number */
.deck-footer {
  position: absolute;
  left: var(--pad); right: var(--pad);
  bottom: clamp(0.8rem, calc(2.2 * var(--vh)), 1.5rem);
  /* grid, not space-between: with three flex items the middle one only lands
     on centre when the brand and the page number happen to be equal widths */
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  color: var(--faint);
  pointer-events: none;
}
.deck-footer .f-brand { color: var(--muted); display: flex; align-items: center; gap: 0.5em; }
.deck-footer .f-title { text-align: center; }
.deck-footer .f-page { text-align: right; }
.deck-footer .f-brand img { height: 1.2em; }

/* divider: section separator — large heading, vertically centred */
section.divider h2 { max-width: 24ch; }
section.divider.centered { justify-items: center; text-align: center; }
section.divider.centered .lede { margin-inline: auto; }

/* keys footer */
.keys {
  display: flex; flex-wrap: wrap;
  gap: 1.5rem 2.5rem;
  margin-top: 3rem;
  color: var(--muted);
  font-size: clamp(0.95rem, calc(1.3 * var(--vw)), 1.15rem);
}

/* ============================================================
   SPINE — segmented progress rail; one segment per section,
   fills with that section's progress, click to jump.
   ============================================================ */
.spine {
  position: fixed;
  left: clamp(0.6rem, calc(1.2 * var(--vw)), 1.4rem);
  top: 50%;
  transform: translateY(-50%);
  height: min(calc(70 * var(--vh)), 40rem);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
  /* generous hover halo so the thin rail is easy to catch */
  padding: 0 0.9rem;
  margin: 0 -0.9rem;
}
.sgroup button {
  all: unset;
  cursor: pointer;
  position: relative;
  width: 4px;
  border-radius: 3px;
  background: var(--line);
  overflow: visible;
  transition: width 0.25s var(--ease);
}
.spine:hover .sgroup button, .spine:focus-within .sgroup button { width: 10px; }
.sgroup button .fill {
  position: absolute; inset: 0 0 auto 0;
  height: calc(var(--p, 0) * 100%);
  border-radius: 3px;
  background: var(--accent);
}
.sgroup button:hover { background: var(--faint); }
.sgroup button.active { background: color-mix(in srgb, var(--accent) 35%, var(--line)); }
/* appendix segments read as backup material: dimmed, gapped off the flow */
.sgroup button.appendix { opacity: 0.45; }
.sgroup:not(:has(.appendix)) + .sgroup:has(.appendix) { margin-top: 10px; }

/* chapters: the current chapter expands into its per-slide segments at full
   weighted size; every other chapter collapses to ONE summary segment with
   an aggregate fill — never a squash of hairline slivers */
.sgroup {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
  flex: var(--w, 1);
  transition: flex 0.35s var(--ease);
}
.sgroup:not(.current) { flex: 600; }
.sgroup .gsum { flex: 1; }
.sgroup.current .gsum { display: none; }
.sgroup:not(.current) button:not(.gsum) { display: none; }

/* horizontal page stepper: chapter name + one dot per slide of the current
   chapter. Opt-in via @pager: top|bottom on the hero; off by default */
.pager {
  display: none;
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
}
.pager.top { top: clamp(0.9rem, calc(2.2 * var(--vh)), 1.6rem); }
.pager.bottom { bottom: clamp(2.6rem, calc(6 * var(--vh)), 3.6rem); }
.pager.top, .pager.bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
  padding: 0.45rem 0.9rem;
  border-radius: 2rem;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.pager .p-ch {
  font: 700 0.6rem var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--faint);
  margin-right: 0.3rem;
}
.pager button {
  all: unset;
  cursor: pointer;
  width: 7px;
  height: 7px;
  border-radius: 4px;
  background: var(--line);
  transition: width 0.25s var(--ease), background 0.2s;
}
.pager button:hover { background: var(--faint); }
.pager button.active { width: 22px; background: var(--accent); }
html.overview .pager, html.inking .pager { display: none; }

/* hovering the rail opens one structured TOC panel — chapters as headings,
   numbered slide rows beneath, the active slide highlighted. One surface,
   not thirty floating chips: the rail shows progress, the panel navigates. */
.toc {
  position: absolute;
  left: calc(100% - 0.3rem);
  top: 50%;
  transform: translateY(-50%) translateX(-8px);
  max-height: min(calc(84 * var(--vh)), 46rem);
  overflow-y: auto;
  background: color-mix(in srgb, var(--surface-2) 92%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 0.75rem;
  padding: 0.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.25s var(--ease);
  white-space: nowrap;
}
.spine:hover .toc, .spine:focus-within .toc {
  opacity: 1;
  transform: translateY(-50%);
  pointer-events: auto;
}
.toc-ch {
  font: 700 0.6rem var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  padding: 0.6rem 0.6rem 0.2rem;
  cursor: pointer;
}
.toc-ch:hover { color: var(--text); }
.toc button {
  all: unset;
  display: flex;
  align-items: baseline;
  gap: 0.55em;
  box-sizing: border-box;
  width: 100%;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
  padding: 0.26rem 0.6rem;
  border-radius: 0.4rem;
}
.toc button:hover { background: var(--accent-soft); color: var(--text); }
.toc button.active { color: var(--text); }
.toc button .n { color: var(--faint); font-size: 0.62rem; }
.toc button.active .n { color: var(--accent); }
.toc button .t { overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }
.toc .toc-append { opacity: 0.55; }
.toc-sep { border-top: 1px solid var(--line); margin: 0.45rem 0.5rem; }

/* ============================================================
   INK — annotation overlay. A draws over the current frame,
   C clears, A/Esc exits; an OS screenshot (Cmd+Ctrl+Shift+4)
   then puts the annotated slide on the clipboard for review.
   ============================================================ */
#ink {
  position: fixed;
  inset: 0;
  /* explicit, not auto: a canvas displays at its intrinsic (bitmap) size,
     which is devicePixelRatio × the viewport — strokes would land at 2×
     the cursor on retina without this */
  width: 100%;
  height: 100%;
  z-index: 40;
  display: none;
  cursor: crosshair;
  touch-action: none;
}
html.inking #ink { display: block; }
.ink-badge {
  position: fixed;
  top: clamp(0.8rem, calc(2 * var(--vw)), 1.5rem);
  right: clamp(0.8rem, calc(2 * var(--vw)), 1.5rem);
  z-index: 41;
  display: none;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 0.5rem;
  padding: 0.3rem 0.7rem;
}
html.inking .ink-badge { display: block; }
.ink-badge .n { color: var(--accent); }

/* comments: in annotate mode, double-click drops a numbered pin with a
   typed note; E copies all notes as a markdown punch list per section.
   Pins live inside their section (z above the ink canvas) so they scroll
   with the content and survive via localStorage */
.note-pin {
  position: absolute;
  z-index: 45;
  display: none;
  transform: translate(-50%, -50%);
  cursor: pointer;
}
html.inking .note-pin { display: block; }
.pin-n {
  display: grid; place-items: center;
  width: 1.5rem; height: 1.5rem;
  border-radius: 50%;
  background: var(--accent-2);
  color: var(--bg);
  font: 700 0.72rem var(--font-mono);
}
.pin-t {
  position: absolute;
  left: 1.9rem; top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  max-width: 40ch; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 0.4rem;
  padding: 0.15rem 0.5rem;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}
.note-pin:hover .pin-t { opacity: 1; }
.note-input {
  position: fixed;
  z-index: 46;
  transform: translate(-50%, -50%);
  width: min(24rem, 80vw);
  font: 0.8rem var(--font-mono);
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--accent);
  border-radius: 0.4rem;
  padding: 0.4rem 0.6rem;
  outline: none;
}

/* ============================================================
   OVERVIEW — O zooms out to a clickable grid of every slide.
   Entered together with .static so scrubs/reveals flatten; zoom
   (not transform) so layout boxes shrink with the content.
   ============================================================ */
html.overview #canvas {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.2rem;
  padding: 1.2rem;
}
html.overview section {
  zoom: 0.16;
  height: auto !important;      /* collapse scrub wrapper heights */
  cursor: pointer;
  outline: 12px solid var(--line);   /* zoomed too — renders ~2px */
  outline-offset: -6px;
  scroll-snap-align: none;
}
html.overview section:hover { outline-color: var(--accent); }
/* the slide you came from: thicker and accented, so it reads at 0.16 zoom */
html.overview section.now { outline-color: var(--accent); outline-width: 28px; }
html.overview .spine { display: none; }

/* ============================================================
   STATIC MODE — shared by prefers-reduced-motion and print:
   scrubs flatten to their completed state, reveals are visible.
   ============================================================ */
html.static .reveal { opacity: 1; transform: none; filter: none; transition: none; }
html.static .scrub { height: auto !important; }
html.static .scrub .stage { position: static; }
html.static .seq .blurb { display: none; }
html.static .chip { color: var(--text); border-color: var(--line); transform: none; }
html.static .track .fill { width: 100% !important; transition: none; }
html.static .static-stages {
  display: block; list-style: none;
  margin-top: 2rem; padding: 0;
  max-width: 62ch;
}
html.static .static-stages li { display: flex; gap: 1em; margin-top: 0.9rem; color: var(--muted); }
html.static .static-stages .head { color: var(--accent); font-family: var(--font-mono); flex-shrink: 0; }
html.static .hero-hint { animation: none; }
/* gradient text via background-clip prints with box artifacts — go solid */
html.static .big-num { background: none; color: var(--accent); }

@media print {
  @page { size: 1920px 1080px; margin: 0; }
  /* the @page size ÷ 100 — keep in sync with the line above */
  :root { --vw: 19.2px; --vh: 10.8px; --vmax: 19.2px; }
  html { scroll-behavior: auto; }
  /* print-only text trim: the on-screen --text-scale is tuned for the back of
     a room; the PDF is read at arm's length */
  :root { --text-scale: 1; }
  /* exact on body, not just section: the page background lives here, and
     without it Chrome prints white pages with near-white text */
  body { background: var(--bg); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  /* background on the section, not just body: the interactive print dialog
     never paints the root canvas background (that's the "Background
     graphics" checkbox, which print-color-adjust cannot override), but it
     does honor exact on element backgrounds */
  /* height + overflow hidden, NOT min-height: a section that overflows by a
     few pixels otherwise spills its footer onto a blank second page and
     breaks the 1-page-per-slide contract verify.sh asserts. Clipping makes
     the overflow visible in the rasterized pages instead of silent */
  section { break-after: page; height: calc(100 * var(--vh)); overflow: hidden; background: var(--bg); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  html.static .scrub { height: calc(100 * var(--vh)) !important; }
  html.static .scrub .stage { min-height: 0; height: 100%; }
  .spine, .pager, .hero-hint, #ink, .ink-badge, .note-pin, .note-input, #backdrop, #vignette { display: none !important; }
}
</style>

## PowerPoint is the bottleneck
AI agents are dramatically better at building **web layouts against a design system** than at positioning boxes in slideware. So let them: write the content as markdown, hand the polish to the browser, and keep a `Cmd+P` PDF as the static deliverable.

- Content lives apart from layout — edit a bullet without touching code

- The whole thing prints to a crisp vector PDF, one section per page

### Content apart from view
The deck is a markdown document at the top of the file. The DOM is rendered from it — no copy is hardcoded in markup.
### Design tokens
Every color, size, and radius comes from one `:root` block. Swap the block, rebrand the deck.

Sections fill the screen. No centered max-width column — this is a presentation, not a blog post.
### Scroll is the timeline
Reveals and scrubbed sequences are driven by scroll position. The keyboard just scrolls for you.
### Print built in
A static layout ships from day one — it serves `prefers-reduced-motion` **and** the PDF export.
### One file
Open `index.html`, present. Nothing to install, nothing to build.

## Scroll is the timeline
This section is *pinned* while you travel through it. Your progress scrubs the sequence below — and each stage is a keyboard waypoint, so **Space steps through this very animation**.
Note: Let it scrub once with the wheel, then step back with ↑ to show the sequence is reversible.
### pin
The section wrapper is taller than the screen; the visible stage sticks to the viewport while you scroll through the wrapper.
### progress
Scroll position through the wrapper becomes a number from 0 to 1. No timers, no state machine — just geometry.
### stages
That number selects the active stage. Scroll back up and the sequence reverses, exactly like scrubbing a video.
### waypoints
Every stage boundary is a stop on the keyboard route. Presenters click through; readers scroll. Same pixels either way.
